name: Desktop

# Builds the desktop app (apps/desktop, a fork of Handy) for Windows and keeps the installer as an
# artifact, so the PC can install it without a Rust toolchain. Runs Hearth's own Rust tests first.
# The Windows steps follow Handy's build.yml.

on:
  pull_request:
    paths: ["apps/desktop/**", ".github/workflows/desktop.yml"]
  push:
    branches: [claude/admiring-wright-ghc2o3]
    paths: ["apps/desktop/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/desktop

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "apps/desktop/src-tauri -> target"
          cache-bin: false

      - name: Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      - name: SPIRV-Headers for the Vulkan speech backend
        shell: pwsh
        run: |
          vcpkg install spirv-headers:x64-windows
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install spirv-headers failed" }
          $prefix = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows" -replace '\\','/'
          Add-Content $env:GITHUB_ENV "CMAKE_PREFIX_PATH=$prefix"

      - name: ONNX Runtime (baseline build, linked dynamically)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $v = "1.24.2"
          Invoke-WebRequest -Uri "https://github.com/microsoft/onnxruntime/releases/download/v$v/onnxruntime-win-x64-$v.zip" -OutFile ort.zip
          Expand-Archive -Path ort.zip -DestinationPath ort-dist -Force
          $lib = (Resolve-Path "ort-dist/onnxruntime-win-x64-$v/lib").Path
          Add-Content $env:GITHUB_ENV "ORT_LIB_LOCATION=$lib"
          Add-Content $env:GITHUB_ENV "ORT_PREFER_DYNAMIC_LINK=1"

      - name: VC++ runtime to bundle beside the app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsRoot = & $vswhere -latest -products * -property installationPath
          $version = (Get-Content (Join-Path $vsRoot "VC\Auxiliary\Build\Microsoft.VCRedistVersion.default.txt")).Trim()
          $archDir = Join-Path $vsRoot "VC\Redist\MSVC\$version\x64"
          $crt = Get-ChildItem $archDir -Directory -Filter "Microsoft.VC*.CRT" | Sort-Object Name | Select-Object -Last 1
          $omp = Get-ChildItem $archDir -Directory -Filter "Microsoft.VC*.OpenMP" | Sort-Object Name | Select-Object -Last 1
          Add-Content $env:GITHUB_ENV "HANDY_VC_REDIST_DIRS=$($crt.FullName);$($omp.FullName)"

      - run: bun install --frozen-lockfile
      - name: Lint and typecheck the settings UI
        run: bun run lint && bunx tsc --noEmit

      - name: Hearth's Rust tests
        working-directory: apps/desktop/src-tauri
        run: cargo test --lib hearth

      - name: Build the installer
        run: bun run tauri build --bundles nsis

      # The bake-off runs beside the installed app, which has the speech libraries it loads.
      - name: Build the bake-off
        working-directory: apps/desktop/src-tauri
        run: cargo build --release --bin bakeoff

      - uses: actions/upload-artifact@v4
        with:
          name: hearth-desktop-windows
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bakeoff.exe
          if-no-files-found: error
          retention-days: 30
