name: CI

on:
  # The deploy branch (what update.ps1 pulls): every merge is tested again, as merged.
  push:
    branches: [claude/admiring-wright-ghc2o3]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hearth
          POSTGRES_PASSWORD: hearth
          POSTGRES_DB: hearth
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hearth"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HEARTH_DATABASE_URL: postgres://hearth:hearth@localhost:5432/hearth
      HEARTH_TEST_DATABASE_URL: postgres://hearth:hearth@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Postgres client tools (backups use pg_dump and pg_restore)
        run: pg_dump --version && pg_restore --version
      - name: Lint and format
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: File size limit
        run: pnpm check:size
      - name: Chromium (page tests and the browser smoke test)
        run: pnpm --filter @hearth/web exec playwright install --with-deps chromium
      - name: Tests
        run: pnpm test
      - name: Build the web app
        run: pnpm build:web
      - name: Main bundle size, and no Loro or WebAssembly in it
        run: pnpm check:bundle
      - name: Browser smoke test
        env:
          HEARTH_ORIGIN: http://localhost:4400
        run: |
          export HEARTH_WEB_DIST="$PWD/apps/web/dist"
          CODE=$(pnpm -s hearth setup | grep -oE '^    [0-9A-F]{10}$' | tr -d ' ')
          pnpm -s hearth serve > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:4400/api/health > /dev/null && break; sleep 1; done
          HEARTH_E2E_URL=http://localhost:4400 HEARTH_E2E_SETUP_CODE="$CODE" pnpm --filter @hearth/web e2e
      - name: Browser extension end-to-end
        run: |
          export HEARTH_WEB_DIST="$PWD/apps/web/dist"
          HEARTH_DEV_AUTH=1 HEARTH_PORT=4401 HEARTH_ORIGIN=http://localhost:4401 HEARTH_CHROME_LAUNCH=off \
            pnpm -s hearth serve > server-dev.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:4401/api/health > /dev/null && break; sleep 1; done
          HEARTH_E2E_URL=http://localhost:4401 pnpm --filter @hearth/web e2e:browser
      - name: Hearth opens Chrome by itself, end-to-end
        run: |
          PROFILE=$(mktemp -d) EXT="$PWD/apps/extension"
          CHROME=$(cd apps/web && node -e "import('playwright').then((p) => console.log(p.chromium.executablePath()))")
          HEARTH_DEV_AUTH=1 HEARTH_PORT=4402 HEARTH_ORIGIN=http://localhost:4402 HEARTH_CHROME_PATH="$CHROME" \
            HEARTH_CHROME_ARGS="--headless=new --no-sandbox --user-data-dir=$PROFILE --disable-extensions-except=$EXT --load-extension=$EXT" \
            pnpm -s hearth serve > server-launch.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:4402/api/health > /dev/null && break; sleep 1; done
          HEARTH_E2E_URL=http://localhost:4402 HEARTH_E2E_PROFILE="$PROFILE" HEARTH_E2E_CHROME="$CHROME" \
            pnpm --filter @hearth/web e2e:chrome-launch
      - name: The app rides through outages, end-to-end
        run: |
          export HEARTH_WEB_DIST="$PWD/apps/web/dist"
          HEARTH_DEV_AUTH=1 HEARTH_PORT=4403 HEARTH_ORIGIN=http://localhost:4403 HEARTH_CHROME_LAUNCH=off \
            pnpm -s hearth serve > server-resilience.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:4403/api/health > /dev/null && break; sleep 1; done
          HEARTH_E2E_URL=http://localhost:4403 pnpm --filter @hearth/web e2e:resilience
      - name: The app opens while Hearth is stopped or not answering, end-to-end
        # Starts and stops its own server on this port.
        run: HEARTH_E2E_PORT=4404 pnpm --filter @hearth/web e2e:offline
      - name: Split panes, the trash and triage by touch, end-to-end
        run: |
          export HEARTH_WEB_DIST="$PWD/apps/web/dist"
          HEARTH_DEV_AUTH=1 HEARTH_PORT=4405 HEARTH_ORIGIN=http://localhost:4405 HEARTH_CHROME_LAUNCH=off \
            pnpm -s hearth serve > server-daily.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:4405/api/health > /dev/null && break; sleep 1; done
          HEARTH_E2E_URL=http://localhost:4405 pnpm --filter @hearth/web e2e:daily
      - name: Server log
        if: failure()
        run: cat server.log server-dev.log server-launch.log server-resilience.log server-daily.log || true

  # Hearth runs on Windows, so it's checked there too: Node 22 (what the PC runs), PostgreSQL 17
  # (what the PC runs), a real server start, and a backup restored into a fresh database.
  # The extension and Chrome-launch end-to-end tests stay on Linux: the extension's session
  # restore fails under Windows Chromium (stream F's work), and chrome-launch drives Chrome the
  # Linux way. The Windows "task" launch is covered by unit tests with a fake runner.
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      HEARTH_DATABASE_URL: postgres://hearth:hearth@127.0.0.1:5432/hearth
      HEARTH_TEST_DATABASE_URL: postgres://hearth:hearth@127.0.0.1:5432/postgres
      HEARTH_CHROME_LAUNCH: "off"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      # The runner image has PostgreSQL installed as a stopped service (user postgres, password
      # root). Start it and add the role Hearth's tests and server use.
      - name: PostgreSQL 17
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bin = if ($env:PGBIN) { $env:PGBIN } else { "C:\Program Files\PostgreSQL\17\bin" }
          $version = & "$bin\postgres.exe" --version
          if ($version -notmatch " 17\.") { throw "Expected PostgreSQL 17 on the runner, found: $version" }
          $svc = Get-Service -Name "postgresql*" | Select-Object -First 1
          Set-Service -Name $svc.Name -StartupType Manual
          Start-Service -Name $svc.Name
          Add-Content $env:GITHUB_PATH $bin
          $env:PGPASSWORD = "root"
          & "$bin\psql.exe" -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 `
            -c "CREATE ROLE hearth LOGIN SUPERUSER PASSWORD 'hearth'" `
            -c "CREATE DATABASE hearth OWNER hearth"
          if ($LASTEXITCODE -ne 0) { throw "Couldn't create the hearth role and database." }
          Write-Host $version
      - run: pnpm install --frozen-lockfile
      - name: Lint and format
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: File size limit
        run: pnpm check:size
      - name: The update and restart scripts (they parse; the update gate's logic)
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ops/windows/test-control.ps1
      - name: Chromium (page tests and the browser smoke test)
        run: pnpm --filter @hearth/web exec playwright install chromium
      # restic, as on the PC: the restore drill test and the backup step below use it.
      - name: restic
        shell: pwsh
        run: |
          choco install restic -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Couldn't install restic." }
          restic version
      - name: Tests
        run: pnpm test
      - name: Build the web app
        run: pnpm build:web
      - name: Server starts and reports this commit, the doctor agrees, then the browser smoke test
        env:
          HEARTH_ORIGIN: http://localhost:4400
        run: |
          export HEARTH_WEB_DIST="$PWD/apps/web/dist"
          CODE=$(pnpm -s hearth setup | grep -oE '^    [0-9A-F]{10}$' | tr -d ' ')
          pnpm -s hearth serve > server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf 127.0.0.1:4400/api/health > /dev/null && break; sleep 1; done
          curl -sf 127.0.0.1:4400/api/health
          # What update.ps1 waits for: this commit, with the database fitting it.
          curl -sf 127.0.0.1:4400/api/health/deep > deep.json
          HEAD=$(git rev-parse HEAD) node -e '
            const d = require("./deep.json");
            if (d.sha !== process.env.HEAD || !d.db.ok || !d.migrations.ok) { console.error(d); process.exit(1); }
            console.log(`Deep health: ${d.status}, build ${d.sha.slice(0, 7)}, ${d.migrations.applied} migrations`);'
          # The doctor runs on Windows and sees the same; whether the runner's disks are full isn't ours.
          pnpm -s hearth doctor --json > doctor.json || true
          node -e '
            const { checks } = require("./doctor.json");
            const mark = (n) => checks.find((c) => c.name === n)?.mark;
            for (const c of checks) console.log(c.mark.padEnd(5), c.name.padEnd(14), c.detail);
            if (mark("Server") !== "ok" || mark("Build") !== "ok" || mark("Migrations") !== "ok") process.exit(1);'
          HEARTH_E2E_URL=http://localhost:4400 HEARTH_E2E_SETUP_CODE="$CODE" pnpm --filter @hearth/web e2e
      - name: Back up, then restore into a fresh database
        run: pnpm -s hearth backup
      - name: Back up off-site with the stored files, lose them, restore everything
        run: |
          T=$(cygpath -m "$RUNNER_TEMP")
          export RESTIC_PASSWORD=ci-only HEARTH_DATA_DIR="$T/hearth-data"
          export HEARTH_BACKUP_REPOSITORY="$T/restic-repo" HEARTH_BACKUP_DIR="$T/hearth-data/backups"
          mkdir -p "$HEARTH_DATA_DIR/voice-samples" && echo hello > "$HEARTH_DATA_DIR/voice-samples/one.txt"
          restic --repo "$HEARTH_BACKUP_REPOSITORY" init
          pnpm -s hearth backup
          rm -rf "$HEARTH_DATA_DIR/voice-samples"
          pnpm -s hearth restore --into hearth_restored_ci
          test "$(cat "$HEARTH_DATA_DIR/voice-samples/one.txt")" = hello
      - name: Server log
        if: failure()
        run: cat server.log || true

  # The real Windows install, as on the PC: install.ps1 as administrator (the runner is one), with
  # its services, Jarvis's task and the backup task; then update.ps1 and `hearth restart jarvis`
  # from the same account as a Limited task like Jarvis's own (UAC is off on the runner, so that
  # still has a full token), and Jarvis ending when only its task is stopped; then an update that
  # hands over to a new update.ps1, and one rolled back by a failing migration. Each checks the
  # services, deep health on the right commit and exactly one Jarvis, the one checking in. Its own
  # job, so a failing unit test in the windows job doesn't skip it. No Chrome task (-SkipChromeTask)
  # and no Claude login: see ops/windows/test-install.ps1.
  windows-install:
    runs-on: windows-latest
    timeout-minutes: 50
    env:
      HEARTH_DATABASE_URL: postgres://hearth:hearth@127.0.0.1:5432/hearth
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          # update.ps1 merges and resets between commits.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: PostgreSQL 17
        run: |
          $ErrorActionPreference = "Stop"
          $bin = if ($env:PGBIN) { $env:PGBIN } else { "C:\Program Files\PostgreSQL\17\bin" }
          $svc = Get-Service -Name "postgresql*" | Select-Object -First 1
          Set-Service -Name $svc.Name -StartupType Manual
          Start-Service -Name $svc.Name
          Add-Content $env:GITHUB_PATH $bin
          $env:PGPASSWORD = "root"
          & "$bin\psql.exe" -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 `
            -c "CREATE ROLE hearth LOGIN SUPERUSER PASSWORD 'hearth'" `
            -c "CREATE DATABASE hearth OWNER hearth"
          if ($LASTEXITCODE -ne 0) { throw "Couldn't create the hearth role and database." }
      - run: pnpm install --frozen-lockfile
      - name: Build the web app
        run: pnpm build:web
      - name: install.ps1 as administrator, then the services, the tasks, deep health and the doctor
        timeout-minutes: 10
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ops/windows/test-install.ps1 -Phase install
      - name: update.ps1 as a Limited task, to the same commit (-Force)
        timeout-minutes: 12
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ops/windows/test-install.ps1 -Phase update
      - name: Jarvis ends with its task, then hearth restart jarvis as a Limited task
        timeout-minutes: 6
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ops/windows/test-install.ps1 -Phase restart
      - name: update.ps1 to a commit that changes update.ps1, whose new copy takes over
        timeout-minutes: 12
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ops/windows/test-install.ps1 -Phase update-new
      - name: update.ps1 to a commit whose migration fails, rolled back
        timeout-minutes: 14
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ops/windows/test-install.ps1 -Phase rollback
      - name: Tasks, services, Jarvis, deep health and the logs
        if: failure()
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ops/windows/test-install.ps1 -Phase logs
