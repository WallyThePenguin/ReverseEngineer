name: CI

on:
  # The deploy branch (what update.ps1 pulls): every merge is tested again, as merged.
  push:
    branches: [claude/admiring-wright-ghc2o3]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hearth
          POSTGRES_PASSWORD: hearth
          POSTGRES_DB: hearth
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hearth"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HEARTH_DATABASE_URL: postgres://hearth:hearth@localhost:5432/hearth
      HEARTH_TEST_DATABASE_URL: postgres://hearth:hearth@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Postgres client tools (backups use pg_dump and pg_restore)
        run: pg_dump --version && pg_restore --version
      - name: Lint and format
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: File size limit
        run: pnpm check:size
      - name: Chromium (page tests and the browser smoke test)
        run: pnpm --filter @hearth/web exec playwright install --with-deps chromium
      - name: Tests
        run: pnpm test
      - name: Build the web app
        run: pnpm build:web
      - name: Main bundle size, and no Loro or WebAssembly in it
        run: pnpm check:bundle
      - name: Browser smoke test
        env:
          HEARTH_ORIGIN: http://localhost:4400
        run: |
          export HEARTH_WEB_DIST="$PWD/apps/web/dist"
          CODE=$(pnpm -s hearth setup | grep -oE '^    [0-9A-F]{10}$' | tr -d ' ')
          pnpm -s hearth serve > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:4400/api/health > /dev/null && break; sleep 1; done
          HEARTH_E2E_URL=http://localhost:4400 HEARTH_E2E_SETUP_CODE="$CODE" pnpm --filter @hearth/web e2e
      - name: Browser extension end-to-end
        run: |
          export HEARTH_WEB_DIST="$PWD/apps/web/dist"
          HEARTH_DEV_AUTH=1 HEARTH_PORT=4401 HEARTH_ORIGIN=http://localhost:4401 HEARTH_CHROME_LAUNCH=off \
            pnpm -s hearth serve > server-dev.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:4401/api/health > /dev/null && break; sleep 1; done
          HEARTH_E2E_URL=http://localhost:4401 pnpm --filter @hearth/web e2e:browser
      - name: Hearth opens Chrome by itself, end-to-end
        run: |
          PROFILE=$(mktemp -d) EXT="$PWD/apps/extension"
          CHROME=$(cd apps/web && node -e "import('playwright').then((p) => console.log(p.chromium.executablePath()))")
          HEARTH_DEV_AUTH=1 HEARTH_PORT=4402 HEARTH_ORIGIN=http://localhost:4402 HEARTH_CHROME_PATH="$CHROME" \
            HEARTH_CHROME_ARGS="--headless=new --no-sandbox --user-data-dir=$PROFILE --disable-extensions-except=$EXT --load-extension=$EXT" \
            pnpm -s hearth serve > server-launch.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:4402/api/health > /dev/null && break; sleep 1; done
          HEARTH_E2E_URL=http://localhost:4402 HEARTH_E2E_PROFILE="$PROFILE" HEARTH_E2E_CHROME="$CHROME" \
            pnpm --filter @hearth/web e2e:chrome-launch
      - name: The app rides through outages, end-to-end
        run: |
          export HEARTH_WEB_DIST="$PWD/apps/web/dist"
          HEARTH_DEV_AUTH=1 HEARTH_PORT=4403 HEARTH_ORIGIN=http://localhost:4403 HEARTH_CHROME_LAUNCH=off \
            pnpm -s hearth serve > server-resilience.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:4403/api/health > /dev/null && break; sleep 1; done
          HEARTH_E2E_URL=http://localhost:4403 pnpm --filter @hearth/web e2e:resilience
      - name: The app opens while Hearth is stopped or not answering, end-to-end
        # Starts and stops its own server on this port.
        run: HEARTH_E2E_PORT=4404 pnpm --filter @hearth/web e2e:offline
      - name: Server log
        if: failure()
        run: cat server.log server-dev.log server-launch.log server-resilience.log || true

  # Hearth runs on Windows, so it's checked there too: Node 22 (what the PC runs), PostgreSQL 17
  # (what the PC runs), a real server start, and a backup restored into a fresh database.
  # The extension and Chrome-launch end-to-end tests stay on Linux: the extension's session
  # restore fails under Windows Chromium (stream F's work), and chrome-launch drives Chrome the
  # Linux way. The Windows "task" launch is covered by unit tests with a fake runner.
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      HEARTH_DATABASE_URL: postgres://hearth:hearth@127.0.0.1:5432/hearth
      HEARTH_TEST_DATABASE_URL: postgres://hearth:hearth@127.0.0.1:5432/postgres
      HEARTH_CHROME_LAUNCH: "off"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      # The runner image has PostgreSQL installed as a stopped service (user postgres, password
      # root). Start it and add the role Hearth's tests and server use.
      - name: PostgreSQL 17
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bin = if ($env:PGBIN) { $env:PGBIN } else { "C:\Program Files\PostgreSQL\17\bin" }
          $version = & "$bin\postgres.exe" --version
          if ($version -notmatch " 17\.") { throw "Expected PostgreSQL 17 on the runner, found: $version" }
          $svc = Get-Service -Name "postgresql*" | Select-Object -First 1
          Set-Service -Name $svc.Name -StartupType Manual
          Start-Service -Name $svc.Name
          Add-Content $env:GITHUB_PATH $bin
          $env:PGPASSWORD = "root"
          & "$bin\psql.exe" -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 `
            -c "CREATE ROLE hearth LOGIN SUPERUSER PASSWORD 'hearth'" `
            -c "CREATE DATABASE hearth OWNER hearth"
          if ($LASTEXITCODE -ne 0) { throw "Couldn't create the hearth role and database." }
          Write-Host $version
      - run: pnpm install --frozen-lockfile
      - name: Lint and format
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: File size limit
        run: pnpm check:size
      - name: The update and restart scripts (they parse; the update gate's logic)
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ops/windows/test-control.ps1
      - name: Chromium (page tests and the browser smoke test)
        run: pnpm --filter @hearth/web exec playwright install chromium
      - name: Tests
        run: pnpm test
      - name: Build the web app
        run: pnpm build:web
      - name: Server starts and answers, then the browser smoke test
        env:
          HEARTH_ORIGIN: http://localhost:4400
        run: |
          export HEARTH_WEB_DIST="$PWD/apps/web/dist"
          CODE=$(pnpm -s hearth setup | grep -oE '^    [0-9A-F]{10}$' | tr -d ' ')
          pnpm -s hearth serve > server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf 127.0.0.1:4400/api/health > /dev/null && break; sleep 1; done
          curl -sf 127.0.0.1:4400/api/health
          HEARTH_E2E_URL=http://localhost:4400 HEARTH_E2E_SETUP_CODE="$CODE" pnpm --filter @hearth/web e2e
      - name: Back up, then restore into a fresh database
        run: pnpm -s hearth backup
      - name: Server log
        if: failure()
        run: cat server.log || true
