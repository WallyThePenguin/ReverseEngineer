<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hearth extension</title>
    <link rel="stylesheet" href="ui.css" />
    <style>body { max-width: 480px; margin: 24px auto; }</style>
  </head>
  <body>
    <h1>Connect Chrome to Hearth</h1>
    <p>In Hearth, open Settings, choose <b>Connect Chrome</b> and paste the code here. Jarvis then works
      in its own Chrome window, and in tabs you hand it from the toolbar button.</p>
    <form id="form">
      <label for="url">Hearth address on this PC</label>
      <input id="url" name="url" placeholder="http://127.0.0.1:4400" />
      <label for="token">Pairing code</label>
      <input id="token" name="token" type="password" autocomplete="off" />
      <div class="row"><button type="submit">Save and connect</button></div>
    </form>
    <p class="status" id="status"></p>
    <script type="module" src="options.js"></script>
  </body>
</html>
