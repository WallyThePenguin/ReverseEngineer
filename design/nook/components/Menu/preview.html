<!doctype html><html><head><meta charset="utf-8"></head><body><div class="re-pane" data-theme="light"><p class="re-tag">Light</p><div class="re-themes" role="group" aria-label="Theme"><button data-theme="light" aria-pressed="true" title="Light" aria-label="Light" style="background:var(--accent)"></button><button data-theme="dark" aria-pressed="false" title="Dark" aria-label="Dark" style="background:var(--accent)"></button><button data-theme="midnight" aria-pressed="false" title="Midnight" aria-label="Midnight" style="background:var(--accent)"></button><button data-theme="dusk" aria-pressed="false" title="Dusk" aria-label="Dusk" style="background:var(--accent)"></button><button data-theme="paper" aria-pressed="false" title="Paper" aria-label="Paper" style="background:var(--accent)"></button><button data-theme="contrast" aria-pressed="false" title="High contrast" aria-label="High contrast" style="background:var(--accent)"></button></div><div class="re-row" style="align-items:flex-start"><div class="re-menu re-glass-strong"><div class="re-item" aria-selected="true"><span class="grow">Float window</span><span class="re-kbd">F</span></div><div class="re-item"><span class="grow">Move to workspace…</span></div><div class="re-item"><span class="grow">Stack with…</span></div><div class="re-sep"></div><div class="re-item"><span class="grow" style="color:var(--danger)">Close window</span><span class="re-kbd">Q</span></div></div>
<div class="re-popover re-glass-strong"><strong>Services</strong><div class="re-caption" style="margin:2px 0 8px;color:var(--ink-muted)">All healthy · checked 9:41</div><div class="re-row" style="gap:6px"><span class="re-badge re-badge--ok"><i></i>Server</span><span class="re-badge re-badge--ok"><i></i>Worker</span><span class="re-badge re-badge--ok"><i></i>Pip</span></div></div></div></div><div class="re-pane" data-theme="dark"><p class="re-tag">Dark</p><div class="re-themes" role="group" aria-label="Theme"><button data-theme="light" aria-pressed="false" title="Light" aria-label="Light" style="background:var(--accent)"></button><button data-theme="dark" aria-pressed="true" title="Dark" aria-label="Dark" style="background:var(--accent)"></button><button data-theme="midnight" aria-pressed="false" title="Midnight" aria-label="Midnight" style="background:var(--accent)"></button><button data-theme="dusk" aria-pressed="false" title="Dusk" aria-label="Dusk" style="background:var(--accent)"></button><button data-theme="paper" aria-pressed="false" title="Paper" aria-label="Paper" style="background:var(--accent)"></button><button data-theme="contrast" aria-pressed="false" title="High contrast" aria-label="High contrast" style="background:var(--accent)"></button></div><div class="re-row" style="align-items:flex-start"><div class="re-menu re-glass-strong"><div class="re-item" aria-selected="true"><span class="grow">Float window</span><span class="re-kbd">F</span></div><div class="re-item"><span class="grow">Move to workspace…</span></div><div class="re-item"><span class="grow">Stack with…</span></div><div class="re-sep"></div><div class="re-item"><span class="grow" style="color:var(--danger)">Close window</span><span class="re-kbd">Q</span></div></div>
<div class="re-popover re-glass-strong"><strong>Services</strong><div class="re-caption" style="margin:2px 0 8px;color:var(--ink-muted)">All healthy · checked 9:41</div><div class="re-row" style="gap:6px"><span class="re-badge re-badge--ok"><i></i>Server</span><span class="re-badge re-badge--ok"><i></i>Worker</span><span class="re-badge re-badge--ok"><i></i>Pip</span></div></div></div></div><script>document.querySelectorAll(".re-themes button").forEach(b=>b.addEventListener("click",()=>{const p=b.closest(".re-pane");p.dataset.theme=b.dataset.theme;p.querySelector(".re-tag").textContent=b.title;p.querySelectorAll(".re-themes button").forEach(x=>x.setAttribute("aria-pressed",x===b))}))</script></body></html>
