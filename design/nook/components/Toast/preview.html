<!-- @dsCard group="Overlays" height=380 subtitle="Notifications" -->
<!doctype html><html><head><meta charset="utf-8"></head><body><div class="re-pane" data-theme="light"><p class="re-tag">Light</p><div class="re-themes" role="group" aria-label="Theme"><button data-theme="light" aria-pressed="true" title="Light" aria-label="Light" style="background:var(--accent)"></button><button data-theme="dark" aria-pressed="false" title="Dark" aria-label="Dark" style="background:var(--accent)"></button><button data-theme="midnight" aria-pressed="false" title="Midnight" aria-label="Midnight" style="background:var(--accent)"></button><button data-theme="dusk" aria-pressed="false" title="Dusk" aria-label="Dusk" style="background:var(--accent)"></button><button data-theme="paper" aria-pressed="false" title="Paper" aria-label="Paper" style="background:var(--accent)"></button><button data-theme="contrast" aria-pressed="false" title="High contrast" aria-label="High contrast" style="background:var(--accent)"></button></div><div class="re-col"><div class="re-toast re-glass-strong"><svg class="pip pip--idle " viewBox="-4 -4 128 128" width="20" height="20" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pip, idle"><rect class="pip-glow" x="8" y="16" width="104" height="100" rx="44" fill="var(--pip-glow)" opacity=".6"/><g class="pip-body">
<rect x="22" y="28" width="76" height="76" rx="26" fill="var(--pip-body)"/>
<g class="pip-eyes"><circle cx="46" cy="60" r="6" fill="var(--pip-eye)"/><circle cx="74" cy="60" r="6" fill="var(--pip-eye)"/><circle cx="48" cy="58" r="2" fill="#fff"/><circle cx="76" cy="58" r="2" fill="#fff"/></g><path d="M56 74 q4 3 8 0" fill="none" stroke="var(--pip-eye)" stroke-width="3" stroke-linecap="round"/>
</g></svg><div><strong>Pip finished</strong><p>Summary of the 2 pm meeting is ready.</p></div></div><div class="re-toast re-glass-strong"><span class="re-badge re-badge--warn"><i></i>Check</span><div><strong>Calendar sync is slow</strong><p>Retrying in 30 seconds.</p></div></div></div></div><div class="re-pane" data-theme="dark"><p class="re-tag">Dark</p><div class="re-themes" role="group" aria-label="Theme"><button data-theme="light" aria-pressed="false" title="Light" aria-label="Light" style="background:var(--accent)"></button><button data-theme="dark" aria-pressed="true" title="Dark" aria-label="Dark" style="background:var(--accent)"></button><button data-theme="midnight" aria-pressed="false" title="Midnight" aria-label="Midnight" style="background:var(--accent)"></button><button data-theme="dusk" aria-pressed="false" title="Dusk" aria-label="Dusk" style="background:var(--accent)"></button><button data-theme="paper" aria-pressed="false" title="Paper" aria-label="Paper" style="background:var(--accent)"></button><button data-theme="contrast" aria-pressed="false" title="High contrast" aria-label="High contrast" style="background:var(--accent)"></button></div><div class="re-col"><div class="re-toast re-glass-strong"><svg class="pip pip--idle " viewBox="-4 -4 128 128" width="20" height="20" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pip, idle"><rect class="pip-glow" x="8" y="16" width="104" height="100" rx="44" fill="var(--pip-glow)" opacity=".6"/><g class="pip-body">
<rect x="22" y="28" width="76" height="76" rx="26" fill="var(--pip-body)"/>
<g class="pip-eyes"><circle cx="46" cy="60" r="6" fill="var(--pip-eye)"/><circle cx="74" cy="60" r="6" fill="var(--pip-eye)"/><circle cx="48" cy="58" r="2" fill="#fff"/><circle cx="76" cy="58" r="2" fill="#fff"/></g><path d="M56 74 q4 3 8 0" fill="none" stroke="var(--pip-eye)" stroke-width="3" stroke-linecap="round"/>
</g></svg><div><strong>Pip finished</strong><p>Summary of the 2 pm meeting is ready.</p></div></div><div class="re-toast re-glass-strong"><span class="re-badge re-badge--warn"><i></i>Check</span><div><strong>Calendar sync is slow</strong><p>Retrying in 30 seconds.</p></div></div></div></div><script>document.querySelectorAll(".re-themes button").forEach(b=>b.addEventListener("click",()=>{const p=b.closest(".re-pane");p.dataset.theme=b.dataset.theme;p.querySelector(".re-tag").textContent=b.title;p.querySelectorAll(".re-themes button").forEach(x=>x.setAttribute("aria-pressed",x===b))}))</script></body></html>
