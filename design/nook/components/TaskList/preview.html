<!doctype html><html><head><meta charset="utf-8"></head><body><div class="re-pane" data-theme="light"><p class="re-tag">Light</p><div class="re-themes" role="group" aria-label="Theme"><button data-theme="light" aria-pressed="true" title="Light" aria-label="Light" style="background:var(--accent)"></button><button data-theme="dark" aria-pressed="false" title="Dark" aria-label="Dark" style="background:var(--accent)"></button><button data-theme="midnight" aria-pressed="false" title="Midnight" aria-label="Midnight" style="background:var(--accent)"></button><button data-theme="dusk" aria-pressed="false" title="Dusk" aria-label="Dusk" style="background:var(--accent)"></button><button data-theme="paper" aria-pressed="false" title="Paper" aria-label="Paper" style="background:var(--accent)"></button><button data-theme="contrast" aria-pressed="false" title="High contrast" aria-label="High contrast" style="background:var(--accent)"></button></div><div class="re-list"><div class="re-rowitem"><span class="re-check re-check--done">✓</span><div class="grow"><strong>Book dentist</strong><small>Done today</small></div></div><div class="re-rowitem"><span class="re-check"></span><div class="grow"><strong>Review PLAN.md</strong><small>Due tomorrow · Work</small></div><span class="re-badge re-badge--warn"><i></i>Due</span></div><div class="re-rowitem"><span class="re-check"></span><div class="grow"><strong>Reply to Maya</strong><small>From Mail · Pip drafted</small></div><span class="re-badge re-badge--accent">Draft</span></div></div></div><div class="re-pane" data-theme="dark"><p class="re-tag">Dark</p><div class="re-themes" role="group" aria-label="Theme"><button data-theme="light" aria-pressed="false" title="Light" aria-label="Light" style="background:var(--accent)"></button><button data-theme="dark" aria-pressed="true" title="Dark" aria-label="Dark" style="background:var(--accent)"></button><button data-theme="midnight" aria-pressed="false" title="Midnight" aria-label="Midnight" style="background:var(--accent)"></button><button data-theme="dusk" aria-pressed="false" title="Dusk" aria-label="Dusk" style="background:var(--accent)"></button><button data-theme="paper" aria-pressed="false" title="Paper" aria-label="Paper" style="background:var(--accent)"></button><button data-theme="contrast" aria-pressed="false" title="High contrast" aria-label="High contrast" style="background:var(--accent)"></button></div><div class="re-list"><div class="re-rowitem"><span class="re-check re-check--done">✓</span><div class="grow"><strong>Book dentist</strong><small>Done today</small></div></div><div class="re-rowitem"><span class="re-check"></span><div class="grow"><strong>Review PLAN.md</strong><small>Due tomorrow · Work</small></div><span class="re-badge re-badge--warn"><i></i>Due</span></div><div class="re-rowitem"><span class="re-check"></span><div class="grow"><strong>Reply to Maya</strong><small>From Mail · Pip drafted</small></div><span class="re-badge re-badge--accent">Draft</span></div></div></div><script>document.querySelectorAll(".re-themes button").forEach(b=>b.addEventListener("click",()=>{const p=b.closest(".re-pane");p.dataset.theme=b.dataset.theme;p.querySelector(".re-tag").textContent=b.title;p.querySelectorAll(".re-themes button").forEach(x=>x.setAttribute("aria-pressed",x===b))}))</script></body></html>
