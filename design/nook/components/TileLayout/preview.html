<!-- @dsCard group="Window manager" height=580 subtitle="Columns, main + stack, grid" -->
<!doctype html><html><head><meta charset="utf-8"></head><body><div class="re-pane" data-theme="light"><p class="re-tag">Light</p><div class="re-themes" role="group" aria-label="Theme"><button data-theme="light" aria-pressed="true" title="Light" aria-label="Light" style="background:var(--accent)"></button><button data-theme="dark" aria-pressed="false" title="Dark" aria-label="Dark" style="background:var(--accent)"></button><button data-theme="midnight" aria-pressed="false" title="Midnight" aria-label="Midnight" style="background:var(--accent)"></button><button data-theme="dusk" aria-pressed="false" title="Dusk" aria-label="Dusk" style="background:var(--accent)"></button><button data-theme="paper" aria-pressed="false" title="Paper" aria-label="Paper" style="background:var(--accent)"></button><button data-theme="contrast" aria-pressed="false" title="High contrast" aria-label="High contrast" style="background:var(--accent)"></button></div><div class="re-row" style="align-items:flex-start"><div class="re-tiles" style="grid-template-columns:1fr 1fr;grid-template-rows:1fr"><div class="re-tile re-tile--focus" style="grid-area:1/1/2/2">Today</div><div class="re-tile" style="grid-area:1/2/2/3">Mail</div></div><div class="re-tiles" style="grid-template-columns:1.4fr 1fr;grid-template-rows:1fr 1fr"><div class="re-tile" style="grid-area:1/1/3/2">Notes</div><div class="re-tile re-tile--focus" style="grid-area:1/2/2/3">Pip</div><div class="re-tile" style="grid-area:2/2/3/3">Browser</div></div><div class="re-tiles" style="grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr"><div class="re-tile" style="grid-area:1/1/2/2">Tasks</div><div class="re-tile re-tile--focus" style="grid-area:1/2/2/3">Calendar</div><div class="re-tile" style="grid-area:2/1/3/2">Mail</div><div class="re-tile" style="grid-area:2/2/3/3">Notes</div></div></div></div><div class="re-pane" data-theme="dark"><p class="re-tag">Dark</p><div class="re-themes" role="group" aria-label="Theme"><button data-theme="light" aria-pressed="false" title="Light" aria-label="Light" style="background:var(--accent)"></button><button data-theme="dark" aria-pressed="true" title="Dark" aria-label="Dark" style="background:var(--accent)"></button><button data-theme="midnight" aria-pressed="false" title="Midnight" aria-label="Midnight" style="background:var(--accent)"></button><button data-theme="dusk" aria-pressed="false" title="Dusk" aria-label="Dusk" style="background:var(--accent)"></button><button data-theme="paper" aria-pressed="false" title="Paper" aria-label="Paper" style="background:var(--accent)"></button><button data-theme="contrast" aria-pressed="false" title="High contrast" aria-label="High contrast" style="background:var(--accent)"></button></div><div class="re-row" style="align-items:flex-start"><div class="re-tiles" style="grid-template-columns:1fr 1fr;grid-template-rows:1fr"><div class="re-tile re-tile--focus" style="grid-area:1/1/2/2">Today</div><div class="re-tile" style="grid-area:1/2/2/3">Mail</div></div><div class="re-tiles" style="grid-template-columns:1.4fr 1fr;grid-template-rows:1fr 1fr"><div class="re-tile" style="grid-area:1/1/3/2">Notes</div><div class="re-tile re-tile--focus" style="grid-area:1/2/2/3">Pip</div><div class="re-tile" style="grid-area:2/2/3/3">Browser</div></div><div class="re-tiles" style="grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr"><div class="re-tile" style="grid-area:1/1/2/2">Tasks</div><div class="re-tile re-tile--focus" style="grid-area:1/2/2/3">Calendar</div><div class="re-tile" style="grid-area:2/1/3/2">Mail</div><div class="re-tile" style="grid-area:2/2/3/3">Notes</div></div></div></div><script>document.querySelectorAll(".re-themes button").forEach(b=>b.addEventListener("click",()=>{const p=b.closest(".re-pane");p.dataset.theme=b.dataset.theme;p.querySelector(".re-tag").textContent=b.title;p.querySelectorAll(".re-themes button").forEach(x=>x.setAttribute("aria-pressed",x===b))}))</script></body></html>
