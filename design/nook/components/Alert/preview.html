<!-- @dsCard group="Overlays" height=520 subtitle="Centered confirmation sheet" -->
<!doctype html><html><head><meta charset="utf-8"></head><body><div class="re-pane" data-theme="light"><p class="re-tag">Light</p><div class="re-themes" role="group" aria-label="Theme"><button data-theme="light" aria-pressed="true" title="Light" aria-label="Light" style="background:var(--accent)"></button><button data-theme="dark" aria-pressed="false" title="Dark" aria-label="Dark" style="background:var(--accent)"></button><button data-theme="midnight" aria-pressed="false" title="Midnight" aria-label="Midnight" style="background:var(--accent)"></button><button data-theme="dusk" aria-pressed="false" title="Dusk" aria-label="Dusk" style="background:var(--accent)"></button><button data-theme="paper" aria-pressed="false" title="Paper" aria-label="Paper" style="background:var(--accent)"></button><button data-theme="contrast" aria-pressed="false" title="High contrast" aria-label="High contrast" style="background:var(--accent)"></button></div><div class="re-alert re-glass-strong"><svg class="pip pip--thinking " viewBox="-4 -4 128 128" width="40" height="40" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pip, thinking"><rect class="pip-glow" x="8" y="16" width="104" height="100" rx="44" fill="var(--pip-glow)" opacity="1"/><g class="pip-body">
<rect x="22" y="28" width="76" height="76" rx="26" fill="var(--pip-body)"/>
<g class="pip-eyes"><circle cx="49" cy="56" r="6" fill="var(--pip-eye)"/><circle cx="77" cy="56" r="6" fill="var(--pip-eye)"/><circle cx="51" cy="54" r="2" fill="#fff"/><circle cx="79" cy="54" r="2" fill="#fff"/></g><path d="M56 76 q4 -3 8 0" fill="none" stroke="var(--pip-eye)" stroke-width="3" stroke-linecap="round"/>
</g><g class="pip-dots"><circle cx="104" cy="30" r="3" fill="var(--ink)"/><circle cx="112" cy="20" r="4" fill="var(--ink)"/><circle cx="120" cy="8" r="5" fill="var(--ink)"/></g></svg><h4>Close 3 windows on workspace 2?</h4><p>Unsaved notes are kept in Trash for 30 days.</p><div class="btns"><button class="re-btn re-btn--primary">Close windows</button><button class="re-btn">Cancel</button></div></div></div><div class="re-pane" data-theme="dark"><p class="re-tag">Dark</p><div class="re-themes" role="group" aria-label="Theme"><button data-theme="light" aria-pressed="false" title="Light" aria-label="Light" style="background:var(--accent)"></button><button data-theme="dark" aria-pressed="true" title="Dark" aria-label="Dark" style="background:var(--accent)"></button><button data-theme="midnight" aria-pressed="false" title="Midnight" aria-label="Midnight" style="background:var(--accent)"></button><button data-theme="dusk" aria-pressed="false" title="Dusk" aria-label="Dusk" style="background:var(--accent)"></button><button data-theme="paper" aria-pressed="false" title="Paper" aria-label="Paper" style="background:var(--accent)"></button><button data-theme="contrast" aria-pressed="false" title="High contrast" aria-label="High contrast" style="background:var(--accent)"></button></div><div class="re-alert re-glass-strong"><svg class="pip pip--thinking " viewBox="-4 -4 128 128" width="40" height="40" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pip, thinking"><rect class="pip-glow" x="8" y="16" width="104" height="100" rx="44" fill="var(--pip-glow)" opacity="1"/><g class="pip-body">
<rect x="22" y="28" width="76" height="76" rx="26" fill="var(--pip-body)"/>
<g class="pip-eyes"><circle cx="49" cy="56" r="6" fill="var(--pip-eye)"/><circle cx="77" cy="56" r="6" fill="var(--pip-eye)"/><circle cx="51" cy="54" r="2" fill="#fff"/><circle cx="79" cy="54" r="2" fill="#fff"/></g><path d="M56 76 q4 -3 8 0" fill="none" stroke="var(--pip-eye)" stroke-width="3" stroke-linecap="round"/>
</g><g class="pip-dots"><circle cx="104" cy="30" r="3" fill="var(--ink)"/><circle cx="112" cy="20" r="4" fill="var(--ink)"/><circle cx="120" cy="8" r="5" fill="var(--ink)"/></g></svg><h4>Close 3 windows on workspace 2?</h4><p>Unsaved notes are kept in Trash for 30 days.</p><div class="btns"><button class="re-btn re-btn--primary">Close windows</button><button class="re-btn">Cancel</button></div></div></div><script>document.querySelectorAll(".re-themes button").forEach(b=>b.addEventListener("click",()=>{const p=b.closest(".re-pane");p.dataset.theme=b.dataset.theme;p.querySelector(".re-tag").textContent=b.title;p.querySelectorAll(".re-themes button").forEach(x=>x.setAttribute("aria-pressed",x===b))}))</script></body></html>
