<!-- @dsCard group="Window manager" height=660 subtitle="Focused and unfocused windows" -->
<!doctype html><html><head><meta charset="utf-8"></head><body><div class="re-pane" data-theme="light"><p class="re-tag">Light</p><div class="re-themes" role="group" aria-label="Theme"><button data-theme="light" aria-pressed="true" title="Light" aria-label="Light" style="background:var(--accent)"></button><button data-theme="dark" aria-pressed="false" title="Dark" aria-label="Dark" style="background:var(--accent)"></button><button data-theme="midnight" aria-pressed="false" title="Midnight" aria-label="Midnight" style="background:var(--accent)"></button><button data-theme="dusk" aria-pressed="false" title="Dusk" aria-label="Dusk" style="background:var(--accent)"></button><button data-theme="paper" aria-pressed="false" title="Paper" aria-label="Paper" style="background:var(--accent)"></button><button data-theme="contrast" aria-pressed="false" title="High contrast" aria-label="High contrast" style="background:var(--accent)"></button></div><div class="re-row" style="align-items:stretch;gap:20px"><div class="re-window re-window--focused" style="width:340px;height:210px"><div class="re-titlebar"><div class="re-wc"><b></b><b></b><b></b></div><div class="re-toolbar"><span class="re-title">Today</span></div><button class="re-btn re-btn--sm re-btn--primary">New</button></div><div class="re-window-body"><div class="re-card"><h4>3 things need you</h4><p>2 tasks due, 1 approval waiting.</p></div></div></div>
<div class="re-window" style="width:300px;height:210px"><div class="re-titlebar"><div class="re-wc"><b></b><b></b><b></b></div><span class="re-title" style="color:var(--ink-muted)">Mail</span></div><div class="re-window-body"><span class="re-caption">Inbox · 12 unread</span></div></div></div></div><div class="re-pane" data-theme="dark"><p class="re-tag">Dark</p><div class="re-themes" role="group" aria-label="Theme"><button data-theme="light" aria-pressed="false" title="Light" aria-label="Light" style="background:var(--accent)"></button><button data-theme="dark" aria-pressed="true" title="Dark" aria-label="Dark" style="background:var(--accent)"></button><button data-theme="midnight" aria-pressed="false" title="Midnight" aria-label="Midnight" style="background:var(--accent)"></button><button data-theme="dusk" aria-pressed="false" title="Dusk" aria-label="Dusk" style="background:var(--accent)"></button><button data-theme="paper" aria-pressed="false" title="Paper" aria-label="Paper" style="background:var(--accent)"></button><button data-theme="contrast" aria-pressed="false" title="High contrast" aria-label="High contrast" style="background:var(--accent)"></button></div><div class="re-row" style="align-items:stretch;gap:20px"><div class="re-window re-window--focused" style="width:340px;height:210px"><div class="re-titlebar"><div class="re-wc"><b></b><b></b><b></b></div><div class="re-toolbar"><span class="re-title">Today</span></div><button class="re-btn re-btn--sm re-btn--primary">New</button></div><div class="re-window-body"><div class="re-card"><h4>3 things need you</h4><p>2 tasks due, 1 approval waiting.</p></div></div></div>
<div class="re-window" style="width:300px;height:210px"><div class="re-titlebar"><div class="re-wc"><b></b><b></b><b></b></div><span class="re-title" style="color:var(--ink-muted)">Mail</span></div><div class="re-window-body"><span class="re-caption">Inbox · 12 unread</span></div></div></div></div><script>document.querySelectorAll(".re-themes button").forEach(b=>b.addEventListener("click",()=>{const p=b.closest(".re-pane");p.dataset.theme=b.dataset.theme;p.querySelector(".re-tag").textContent=b.title;p.querySelectorAll(".re-themes button").forEach(x=>x.setAttribute("aria-pressed",x===b))}))</script></body></html>
