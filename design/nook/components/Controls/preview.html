<!doctype html><html><head><meta charset="utf-8"></head><body><div class="re-pane" data-theme="light"><p class="re-tag">Light</p><div class="re-themes" role="group" aria-label="Theme"><button data-theme="light" aria-pressed="true" title="Light" aria-label="Light" style="background:var(--accent)"></button><button data-theme="dark" aria-pressed="false" title="Dark" aria-label="Dark" style="background:var(--accent)"></button><button data-theme="midnight" aria-pressed="false" title="Midnight" aria-label="Midnight" style="background:var(--accent)"></button><button data-theme="dusk" aria-pressed="false" title="Dusk" aria-label="Dusk" style="background:var(--accent)"></button><button data-theme="paper" aria-pressed="false" title="Paper" aria-label="Paper" style="background:var(--accent)"></button><button data-theme="contrast" aria-pressed="false" title="High contrast" aria-label="High contrast" style="background:var(--accent)"></button></div><div class="re-row" style="align-items:flex-start"><div class="re-field"><label for="a">Server address</label><input id="a" class="re-input" value="http://localhost:4400"><span class="re-hint">Where Nook's services answer.</span></div><div class="re-search">Search</div></div>
<div class="re-row" style="margin-top:16px"><span class="re-label"><span class="re-checkbox" role="checkbox" aria-checked="true">✓</span>Start at login</span><span class="re-label"><span class="re-checkbox" role="checkbox" aria-checked="false"></span>Show in menu bar</span><span class="re-label"><span class="re-radio" role="radio" aria-checked="true"></span>Tile</span><span class="re-label"><span class="re-radio" role="radio" aria-checked="false"></span>Float</span></div>
<div class="re-row" style="margin-top:20px"><div class="re-slider"><i style="width:65%"></i><b style="left:65%"></b></div><span class="re-switch" role="switch" aria-checked="true"></span><span class="re-switch" role="switch" aria-checked="false"></span><div class="re-seg"><button aria-pressed="true">Tile</button><button aria-pressed="false">Float</button><button aria-pressed="false">Stack</button></div></div></div><div class="re-pane" data-theme="dark"><p class="re-tag">Dark</p><div class="re-themes" role="group" aria-label="Theme"><button data-theme="light" aria-pressed="false" title="Light" aria-label="Light" style="background:var(--accent)"></button><button data-theme="dark" aria-pressed="true" title="Dark" aria-label="Dark" style="background:var(--accent)"></button><button data-theme="midnight" aria-pressed="false" title="Midnight" aria-label="Midnight" style="background:var(--accent)"></button><button data-theme="dusk" aria-pressed="false" title="Dusk" aria-label="Dusk" style="background:var(--accent)"></button><button data-theme="paper" aria-pressed="false" title="Paper" aria-label="Paper" style="background:var(--accent)"></button><button data-theme="contrast" aria-pressed="false" title="High contrast" aria-label="High contrast" style="background:var(--accent)"></button></div><div class="re-row" style="align-items:flex-start"><div class="re-field"><label for="a">Server address</label><input id="a" class="re-input" value="http://localhost:4400"><span class="re-hint">Where Nook's services answer.</span></div><div class="re-search">Search</div></div>
<div class="re-row" style="margin-top:16px"><span class="re-label"><span class="re-checkbox" role="checkbox" aria-checked="true">✓</span>Start at login</span><span class="re-label"><span class="re-checkbox" role="checkbox" aria-checked="false"></span>Show in menu bar</span><span class="re-label"><span class="re-radio" role="radio" aria-checked="true"></span>Tile</span><span class="re-label"><span class="re-radio" role="radio" aria-checked="false"></span>Float</span></div>
<div class="re-row" style="margin-top:20px"><div class="re-slider"><i style="width:65%"></i><b style="left:65%"></b></div><span class="re-switch" role="switch" aria-checked="true"></span><span class="re-switch" role="switch" aria-checked="false"></span><div class="re-seg"><button aria-pressed="true">Tile</button><button aria-pressed="false">Float</button><button aria-pressed="false">Stack</button></div></div></div><script>document.querySelectorAll(".re-themes button").forEach(b=>b.addEventListener("click",()=>{const p=b.closest(".re-pane");p.dataset.theme=b.dataset.theme;p.querySelector(".re-tag").textContent=b.title;p.querySelectorAll(".re-themes button").forEach(x=>x.setAttribute("aria-pressed",x===b))}))</script></body></html>
