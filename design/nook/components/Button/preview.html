<!doctype html><html><head><meta charset="utf-8"></head><body><div class="re-pane" data-theme="light"><p class="re-tag">Light</p><div class="re-themes" role="group" aria-label="Theme"><button data-theme="light" aria-pressed="true" title="Light" aria-label="Light" style="background:var(--accent)"></button><button data-theme="dark" aria-pressed="false" title="Dark" aria-label="Dark" style="background:var(--accent)"></button><button data-theme="midnight" aria-pressed="false" title="Midnight" aria-label="Midnight" style="background:var(--accent)"></button><button data-theme="dusk" aria-pressed="false" title="Dusk" aria-label="Dusk" style="background:var(--accent)"></button><button data-theme="paper" aria-pressed="false" title="Paper" aria-label="Paper" style="background:var(--accent)"></button><button data-theme="contrast" aria-pressed="false" title="High contrast" aria-label="High contrast" style="background:var(--accent)"></button></div><div class="re-row"><button class="re-btn re-btn--primary">Ask Pip</button><button class="re-btn">Snooze</button><button class="re-btn re-btn--quiet">Cancel</button><button class="re-btn re-btn--danger">Delete</button><button class="re-btn" disabled>Disabled</button></div><div class="re-row" style="margin-top:12px"><button class="re-btn re-btn--lg re-btn--primary">New session</button><button class="re-btn re-btn--sm">Small</button><button class="re-btn re-btn--icon" aria-label="Add">+</button></div></div><div class="re-pane" data-theme="dark"><p class="re-tag">Dark</p><div class="re-themes" role="group" aria-label="Theme"><button data-theme="light" aria-pressed="false" title="Light" aria-label="Light" style="background:var(--accent)"></button><button data-theme="dark" aria-pressed="true" title="Dark" aria-label="Dark" style="background:var(--accent)"></button><button data-theme="midnight" aria-pressed="false" title="Midnight" aria-label="Midnight" style="background:var(--accent)"></button><button data-theme="dusk" aria-pressed="false" title="Dusk" aria-label="Dusk" style="background:var(--accent)"></button><button data-theme="paper" aria-pressed="false" title="Paper" aria-label="Paper" style="background:var(--accent)"></button><button data-theme="contrast" aria-pressed="false" title="High contrast" aria-label="High contrast" style="background:var(--accent)"></button></div><div class="re-row"><button class="re-btn re-btn--primary">Ask Pip</button><button class="re-btn">Snooze</button><button class="re-btn re-btn--quiet">Cancel</button><button class="re-btn re-btn--danger">Delete</button><button class="re-btn" disabled>Disabled</button></div><div class="re-row" style="margin-top:12px"><button class="re-btn re-btn--lg re-btn--primary">New session</button><button class="re-btn re-btn--sm">Small</button><button class="re-btn re-btn--icon" aria-label="Add">+</button></div></div><script>document.querySelectorAll(".re-themes button").forEach(b=>b.addEventListener("click",()=>{const p=b.closest(".re-pane");p.dataset.theme=b.dataset.theme;p.querySelector(".re-tag").textContent=b.title;p.querySelectorAll(".re-themes button").forEach(x=>x.setAttribute("aria-pressed",x===b))}))</script></body></html>
