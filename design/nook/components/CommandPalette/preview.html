<!-- @dsCard group="Overlays" height=700 subtitle="Spotlight-style launcher" -->
<!doctype html><html><head><meta charset="utf-8"></head><body><div class="re-pane" data-theme="light"><p class="re-tag">Light</p><div class="re-themes" role="group" aria-label="Theme"><button data-theme="light" aria-pressed="true" title="Light" aria-label="Light" style="background:var(--accent)"></button><button data-theme="dark" aria-pressed="false" title="Dark" aria-label="Dark" style="background:var(--accent)"></button><button data-theme="midnight" aria-pressed="false" title="Midnight" aria-label="Midnight" style="background:var(--accent)"></button><button data-theme="dusk" aria-pressed="false" title="Dusk" aria-label="Dusk" style="background:var(--accent)"></button><button data-theme="paper" aria-pressed="false" title="Paper" aria-label="Paper" style="background:var(--accent)"></button><button data-theme="contrast" aria-pressed="false" title="High contrast" aria-label="High contrast" style="background:var(--accent)"></button></div><div class="re-palette re-glass-strong"><div class="re-palette-input"><span>⌕</span> <span style="color:var(--ink)">open mail</span></div><div class="re-group re-overline">Views</div><div class="re-item" aria-selected="true"><span class="re-ico">M</span><span class="grow">Mail</span><span class="meta">Inbox · 12</span><span class="re-kbd">Enter</span></div><div class="re-item"><span class="re-ico">W</span><span class="grow">Move window to workspace 3</span><span class="re-kbd">Win</span><span class="re-kbd">Shift</span><span class="re-kbd">3</span></div><div class="re-item"><span class="re-ico">J</span><span class="grow">Ask Pip about this</span></div></div></div><div class="re-pane" data-theme="dark"><p class="re-tag">Dark</p><div class="re-themes" role="group" aria-label="Theme"><button data-theme="light" aria-pressed="false" title="Light" aria-label="Light" style="background:var(--accent)"></button><button data-theme="dark" aria-pressed="true" title="Dark" aria-label="Dark" style="background:var(--accent)"></button><button data-theme="midnight" aria-pressed="false" title="Midnight" aria-label="Midnight" style="background:var(--accent)"></button><button data-theme="dusk" aria-pressed="false" title="Dusk" aria-label="Dusk" style="background:var(--accent)"></button><button data-theme="paper" aria-pressed="false" title="Paper" aria-label="Paper" style="background:var(--accent)"></button><button data-theme="contrast" aria-pressed="false" title="High contrast" aria-label="High contrast" style="background:var(--accent)"></button></div><div class="re-palette re-glass-strong"><div class="re-palette-input"><span>⌕</span> <span style="color:var(--ink)">open mail</span></div><div class="re-group re-overline">Views</div><div class="re-item" aria-selected="true"><span class="re-ico">M</span><span class="grow">Mail</span><span class="meta">Inbox · 12</span><span class="re-kbd">Enter</span></div><div class="re-item"><span class="re-ico">W</span><span class="grow">Move window to workspace 3</span><span class="re-kbd">Win</span><span class="re-kbd">Shift</span><span class="re-kbd">3</span></div><div class="re-item"><span class="re-ico">J</span><span class="grow">Ask Pip about this</span></div></div></div><script>document.querySelectorAll(".re-themes button").forEach(b=>b.addEventListener("click",()=>{const p=b.closest(".re-pane");p.dataset.theme=b.dataset.theme;p.querySelector(".re-tag").textContent=b.title;p.querySelectorAll(".re-themes button").forEach(x=>x.setAttribute("aria-pressed",x===b))}))</script></body></html>
